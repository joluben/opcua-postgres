# ============================================================================
# Release — Conector OPC-UA → TimescaleDB
#
# Pipeline de publicación. Se dispara SOLO al publicar un tag v*.*.*:
#   1. Tests + integración (reutiliza ci.yml: una única definición)
#   2. Build de imagen Docker multi-arch (amd64 + arm64) con buildx
#   3. Push a GitHub Container Registry (ghcr.io)
#
# Etiquetas publicadas: <version>, <major>.<minor>, <major>, sha-<corto> y latest.
# `latest` se mueve únicamente con releases, no con cada push a main. Si se
# publica un tag antiguo después de uno nuevo, `latest` retrocede: publicar los
# tags en orden.
#
# Requisitos:
#   - Settings → Actions → General → Workflow permissions: opción restrictiva
#     ("Read repository contents and packages permissions"); el job de build
#     declara `packages: write` explícitamente.
#   - Paquete GHCR existente: Settings del paquete → Manage Actions access →
#     añadir este repositorio con rol Write (o definir el secret GHCR_TOKEN).
#   - GITHUB_TOKEN tiene permiso automático sobre ghcr.io si el paquete está
#     enlazado/accesible por el repositorio.
# ============================================================================
name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  # Un release no debe cancelarse a mitad de la publicación de la imagen.
  cancel-in-progress: false

jobs:
  # ── Job 1: Tests + integración (workflow reutilizable) ────────────────────
  tests:
    uses: ./.github/workflows/ci.yml

  # ── Job 2: Build + Push ───────────────────────────────────────────────────
  build:
    name: Build & Push Image
    needs: tests
    runs-on: ubuntu-latest
    # Único job que necesita publicar en GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          # GITHUB_TOKEN solo puede escribir si el paquete ya existente concede
          # acceso Write a este repositorio (Manage Actions access). Como
          # alternativa, definir GHCR_TOKEN (PAT clásico con write:packages).
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semver en tags v1.0.1 → 1.0.1, 1.0, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # SHA corto del commit liberado (trazabilidad)
            type=sha,prefix=sha-,format=short
            # latest apunta siempre a la última release publicada
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: echo "Imagen publicada en GHCR"