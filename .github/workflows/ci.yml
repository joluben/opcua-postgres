# ============================================================================
# CI/CD — Conector OPC-UA → TimescaleDB
#
# Pipeline:
#   1. Tests (pytest) sobre Python 3.12 con dependencias del lock reproducible
#   2. Build de imagen Docker multi-arch (amd64 + arm64) con buildx
#   3. Push a GitHub Container Registry (ghcr.io)
#
# Triggers:
#   - Push a main          → tests + build + push (tag: latest + sha + branch)
#   - Pull request a main  → tests + build (sin push)
#   - Tag v*.*.*           → tests + build + push (tag: semver + latest)
#
# Requisitos:
#   - Settings → Actions → General → Workflow permissions: basta con la opción
#     restrictiva ("Read repository contents and packages permissions"), porque
#     este workflow declara permisos explícitos por job.
#   - Paquete GHCR existente: Settings del paquete → Manage Actions access →
#     añadir este repositorio con rol Write (o definir el secret GHCR_TOKEN).
#   - GITHUB_TOKEN tiene permiso automático para ghcr.io si el paquete está
#     enlazado/accesible por el repositorio.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Tests ──────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Permisos mínimos: este job no publica nada.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Instala versiones exactas del lock (reproducible).
          pip install -r requirements.lock
          # Herramientas de test (no forman parte del runtime).
          pip install "pytest>=8,<10" "pytest-asyncio>=1.0,<2" "ruff>=0.6,<1"

      - name: Lint (nombres no definidos / F821)
        run: ruff check --select F821 connector tests

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  # ── Job 2: Integración con PostgreSQL real y rol restringido ──────────────
  integration:
    name: Integration (PostgreSQL + restricted role)
    needs: test
    runs-on: ubuntu-latest
    # Permisos mínimos: solo lee el repositorio.
    permissions:
      contents: read
    services:
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: scada_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scada_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install "pytest>=8,<10" "pytest-asyncio>=1.0,<2"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Provision restricted role with dba_setup.sql
        env:
          PGPASSWORD: admin
        run: |
          sed "s/PASSWORD 'SECRET'/PASSWORD 'acceptance'/" scripts/dba_setup.sql > /tmp/dba.sql
          psql -h localhost -U postgres -d scada_db -v ON_ERROR_STOP=1 -f /tmp/dba.sql

      - name: Run acceptance tests
        env:
          ACCEPTANCE_ADMIN_DSN: postgresql://postgres:admin@localhost:5432/scada_db
          ACCEPTANCE_CONNECTOR_DSN: postgresql://connector_user:acceptance@localhost:5432/scada_db
        run: python -m pytest tests/integration -q -m integration --tb=short

  # ── Job 3: Build + Push ───────────────────────────────────────────────────
  build:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    # Único job que necesita publicar en GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # GITHUB_TOKEN solo puede escribir si el paquete ya existente concede
          # acceso Write a este repositorio (Manage Actions access). Como
          # alternativa, definir GHCR_TOKEN (PAT clásico con write:packages).
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semver en tags v1.0.0 → 1.0.0, 1.0, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # SHA corto en push a main
            type=sha,prefix=sha-,format=short
            # Branch name
            type=ref,event=branch
            # latest en main y tags
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        if: github.event_name != 'pull_request'
        run: echo "Imagen publicada en GHCR"
