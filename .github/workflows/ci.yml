# ============================================================================
# CI — Conector OPC-UA → TimescaleDB
#
# Pipeline de validación (no publica imagen):
#   1. Tests (pytest) sobre Python 3.12 con dependencias del lock reproducible
#   2. Integración con PostgreSQL/TimescaleDB real y rol restringido
#
# Triggers:
#   - Push a main          → tests + integración
#   - Pull request a main  → tests + integración
#   - workflow_call        → reutilizado por release.yml (tags v*.*.*)
#
# La build y publicación de imagen viven en release.yml. Así, subir commit y
# tag a la vez no ejecuta dos veces la build ni publica dos veces en GHCR.
#
# Requisitos:
#   - Settings → Actions → General → Workflow permissions: basta con la opción
#     restrictiva ("Read repository contents and packages permissions"), porque
#     este workflow declara permisos explícitos por job.
#   - Las acciones se fijan a los majors que declaran runtime **node24**
#     (Node 20 está deprecado en los runners). Al subir de major, revisar el
#     changelog de la acción: aquí solo se usan inputs estables.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite que release.yml reutilice estos jobs (una sola definición de tests).
  workflow_call:

# Un push nuevo a la misma rama cancela la ejecución anterior. El prefijo `ci-`
# evita colisionar con el grupo de release.yml cuando este llama a este workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Tests ──────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Permisos mínimos: este job no publica nada.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Instala versiones exactas del lock (reproducible).
          pip install -r requirements.lock
          # Herramientas de test (no forman parte del runtime).
          pip install "pytest>=8,<10" "pytest-asyncio>=1.0,<2" "ruff>=0.6,<1"

      - name: Lint (nombres no definidos / F821)
        run: ruff check --select F821 connector tests

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  # ── Job 2: Integración con PostgreSQL real y rol restringido ──────────────
  integration:
    name: Integration (PostgreSQL + restricted role)
    needs: test
    runs-on: ubuntu-latest
    # Permisos mínimos: solo lee el repositorio.
    permissions:
      contents: read
    services:
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: scada_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scada_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install "pytest>=8,<10" "pytest-asyncio>=1.0,<2"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Provision restricted role with dba_setup.sql
        env:
          PGPASSWORD: admin
        run: |
          sed "s/PASSWORD 'SECRET'/PASSWORD 'acceptance'/" scripts/dba_setup.sql > /tmp/dba.sql
          psql -h localhost -U postgres -d scada_db -v ON_ERROR_STOP=1 \
            -v schema_name=opcua -f /tmp/dba.sql

      - name: Run acceptance tests
        env:
          ACCEPTANCE_ADMIN_DSN: postgresql://postgres:admin@localhost:5432/scada_db
          ACCEPTANCE_CONNECTOR_DSN: postgresql://connector_user:acceptance@localhost:5432/scada_db
          ACCEPTANCE_SCHEMA: opcua
        run: python -m pytest tests/integration -q -m integration --tb=short