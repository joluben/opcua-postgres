# Stack opcional de monitorización para el conector OPC-UA.
#
#   docker compose -f docker-compose.monitoring.yml up -d
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD)
#
# Scrapea los puertos publicados por los conectores en el host
# (connector-01 -> 8001, connector-02 -> 8002, ...). Para más conectores,
# añadir targets en monitoring/prometheus/prometheus.yml.
#
# Este fichero es independiente del stack de producción: no modifica los
# conectores ni la BD.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: opc-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.4.0
    container_name: opc-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
