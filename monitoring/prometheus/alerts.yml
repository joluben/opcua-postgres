# Alertas de producción del conector OPC-UA.
#
# Supuestos:
# - `opc_connector_queue_capacity` y `opc_connector_spill_capacity_bytes` las
#   expone el propio conector.
# - Cada conector es un target del job `opcua_connectors`.
#
# Ajustar los umbrales al SLA acordado antes de desplegar.

groups:
  - name: opcua-connector-disponibilidad
    interval: 30s
    rules:
      - alert: OpcConnectorTargetDown
        expr: up{job="opcua_connectors"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Conector OPC-UA no scrapeable ({{ $labels.instance }})"
          description: >-
            Prometheus no puede leer /metrics. El contenedor está caído, el
            puerto no responde o el healthcheck ha fallado.

      - alert: OpcConnectorDbDown
        expr: opc_connector_db_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Conector sin conexión a PostgreSQL ({{ $labels.instance }})"
          description: >-
            Los datos se acumulan en memoria y, si persiste, en el spill de
            disco. Revisar red/BD y el log `batch_write_failed`.

      - alert: OpcConnectorOpcDown
        expr: opc_connector_session_status == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Sesión OPC-UA perdida ({{ $labels.instance }})"
          description: >-
            El conector está reintentando la conexión OPC-UA. Revisar red,
            certificados y límites de sesión del servidor.

  - name: opcua-connector-buffer
    interval: 30s
    rules:
      - alert: OpcConnectorQueueHigh
        expr: >-
          (opc_connector_queue_size
           / clamp_min(opc_connector_queue_capacity, 1)) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cola en memoria > 80% ({{ $labels.instance }})"
          description: >-
            La ingesta supera la capacidad de escritura. Revisar latencia de BD,
            POSTGRES_BATCH_SIZE y POSTGRES_NUM_WRITERS antes de que empiece el
            spill a disco.

      - alert: OpcConnectorSpillActive
        expr: opc_connector_spill_bytes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Spill en disco activo ({{ $labels.instance }})"
          description: >-
            Hay datos pendientes en disco. Es normal durante una caída de BD;
            si la BD está sana, investigar el replay y la latencia de escritura.

      - alert: OpcConnectorSpillCapacityHigh
        expr: >-
          (opc_connector_spill_bytes
           / clamp_min(opc_connector_spill_capacity_bytes, 1)) > 0.8
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Spill > 80% de su límite ({{ $labels.instance }})"
          description: >-
            Al llegar al 100% se descartan segmentos antiguos (pérdida de
            datos). Ampliar POSTGRES_SPILL_MAX_MB o recuperar la BD.

      - alert: OpcConnectorSpillDataLoss
        expr: increase(opc_connector_spill_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Segmentos de spill descartados ({{ $labels.instance }})"
          description: >-
            El cap de disco ha borrado datos no confirmados. Revisar capacidad
            del volumen y el SLA de pérdida.

      - alert: OpcConnectorSpillDroppedUnacked
        expr: increase(opc_connector_spill_dropped_unacked_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Spill descartado sin ACK: pérdida de datos ({{ $labels.instance }})"
          description: >-
            El límite de disco se ha aplicado sobre segmentos cuyos datos aún no
            se habían confirmado en PostgreSQL. Ampliar el volumen/spill o
            recuperar la BD; revisar el SLA de pérdida.

      - alert: OpcConnectorValuesDropped
        expr: increase(opc_connector_values_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Valores descartados por buffer/spill lleno ({{ $labels.instance }})"
          description: >-
            Se están perdiendo registros antes de persistirlos. Ampliar cola,
            spill o reducir la tasa de ingesta.

  - name: opcua-connector-rendimiento
    interval: 30s
    rules:
      - alert: OpcConnectorBatchLagHigh
        expr: opc_connector_batch_lag_seconds > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Lag de lote > 30 s ({{ $labels.instance }})"
          description: >-
            El timestamp OPC más antiguo del lote tiene más de 30 s. Revisar
            throughput, tamaño de lote y salud de la BD.

      - alert: OpcConnectorWriteLatencyHigh
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(opc_connector_write_latency_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latencia de escritura p95 > 1 s ({{ $labels.instance }})"
          description: >-
            El COPY/INSERT está tardando más de lo presupuestado. Revisar
            índices, compresión y recursos de PostgreSQL.

  - name: opcua-connector-integridad
    interval: 30s
    rules:
      - alert: OpcConnectorDedupDisabled
        expr: opc_connector_dedup_enabled == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Deduplicación desactivada ({{ $labels.instance }})"
          description: >-
            POSTGRES_DEDUP_ENABLED=false: un replay tras un crash puede
            duplicar filas. Confirmar que es una decisión operativa.

      - alert: OpcConnectorDuplicatesHigh
        expr: rate(opc_connector_values_duplicates_total[5m]) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tasa de duplicados deduplicados elevada ({{ $labels.instance }})"
          description: >-
            ON CONFLICT está descartando muchas filas. Si es sostenido, hay
            reentregas repetidas (ACK/replay) y conviene revisar el spill.

      - alert: OpcConnectorDrainTimeouts
        expr: increase(opc_connector_spill_drain_timeouts_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Timeouts del drain del spill ({{ $labels.instance }})"
          description: >-
            El worker del spill no responde a tiempo. No se pierden datos (el
            lote queda sin ACK), pero el replay se retrasa. Revisar I/O de disco.

      - alert: OpcConnectorSpillReplayPending
        expr: opc_connector_spill_replay_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Replay del spill pendiente de ACK ({{ $labels.instance }})"
          description: >-
            Hay registros leídos del spill que llevan más de 5 minutos sin
            confirmarse en BD. Comprobar errores de escritura, latencia y el
            estado de PostgreSQL; el lote se reintenta sin pérdida.

      - alert: OpcConnectorShutdownDropped
        expr: increase(opc_connector_shutdown_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Registros perdidos durante el apagado ({{ $labels.instance }})"
          description: >-
            El apagado no pudo drenar ni persistir todos los registros. Revisar
            el volumen de spill y ampliar SHUTDOWN_TIMEOUT_S/stop_grace_period.

      - alert: OpcConnectorShutdownSlow
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(opc_connector_shutdown_seconds_bucket[1h]))
          ) > 24
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Apagado cerca del timeout ({{ $labels.instance }})"
          description: >-
            El p95 del apagado supera 24 s (80% de SHUTDOWN_TIMEOUT_S=30 s).
            Aumentar el timeout o investigar el drenado del spill.

      - alert: OpcConnectorSpillWriteErrors
        expr: increase(opc_connector_spill_write_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Errores de escritura en el spill ({{ $labels.instance }})"
          description: >-
            El worker no puede escribir/aplicar el cap en disco (lleno, permisos
            o I/O). Los lotes se reintentan en un backlog acotado; si persiste,
            se descartarán de forma visible. Revisar el volumen de spill.

      - alert: OpcConnectorSpillFsyncErrors
        expr: increase(opc_connector_spill_fsync_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Fallos de fsync en el spill ({{ $labels.instance }})"
          description: >-
            flush/fsync falla: la durabilidad de los datos en disco no está
            garantizada ante una caída. Revisar el dispositivo/volumen y el log
            `spill_fsync_failed`.

      - alert: OpcConnectorSpillRecordsDropped
        expr: increase(opc_connector_spill_dropped_records_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Registros descartados por fallo de disco ({{ $labels.instance }})"
          description: >-
            Se agotó el backlog de reintento del spill y se han descartado
            registros. Pérdida de datos: revisar capacidad/salud del volumen y
            el SLA de pérdida.

      - alert: OpcConnectorReconnectionsHigh
        expr: rate(opc_connector_opc_reconnections_total[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Reconexiones OPC-UA frecuentes ({{ $labels.instance }})"
          description: >-
            Más de una reconexión por segundo de media. Revisar red, timeout de
            sesión, certificados y logs del servidor OPC-UA.
